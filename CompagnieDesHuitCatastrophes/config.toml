# Configuration propre à cette campagne ; français et voix Pocket.
language = "fr"
history_limit = 30
checkpoint_every_turns = 20

[llm]
backend = "ollama"
model = "qwen2.5:7b-instruct"
host = "http://localhost:11434"
stream = true
num_ctx = 8192

[stt]
model = "small"
language = "fr"
device = "auto"

[tts]
backend = "pocket"
model = "french"
voice = "estelle"

